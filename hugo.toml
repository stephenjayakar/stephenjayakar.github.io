baseURL = "https://stephenjayakar.com/"
languageCode = 'en-us'
title = "Hi, I'm Stephen 👋"
disableLanguages = ['de']
enableRobotsTXT = true
enableGitInfo = true

[taxonomies]
  tag = 'tags'

[menu]
  [[menu.main]]
    name = "About"
    url = "/about"
    weight = 1
  # [[menu.main]]
  #   name = "Resume"
  #   url = "/resume"
  #   weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]']]
          inline = [['$$', '$$'], ['\(', '\)']]
  # (Optional) To be able to use all Prism plugins, the theme enables unsafe
  # rendering by default
  _merge = "deep"

[build]
  useResourceCacheWhen = "fallback"
# [build]
#   # Merge build config of the theme
#   _merge = "deep"

[outputs]
  home = ["html", "searchIndex"]

[outputFormats]
  [outputFormats.searchIndex]
    mediaType = "application/json"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

# This hopefully will be simpler in the future.
# See: https://github.com/schnerring/hugo-theme-gruvbox/issues/16
[module]
  [[module.imports]]
    path = "github.com/schnerring/hugo-theme-gruvbox"
  [[module.imports]]
    path = "github.com/schnerring/hugo-mod-json-resume"
    [[module.imports.mounts]]
      # This will add the sample Richard Hendricks CV data
      source = "data"
      target = "data"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
    [[module.imports.mounts]]
      source = "assets/css/json-resume.css"
      target = "assets/css/critical/44-json-resume.css"
  [[module.mounts]]
    # required by hugo-mod-json-resume
    source = "node_modules/simple-icons/icons"
    target = "assets/simple-icons"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  # Make static post images available to Hugo's image pipeline while keeping
  # their original URLs available for social cards and external links.
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"
  [[module.mounts]]
    source = "node_modules/typeface-fira-code/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/typeface-roboto-slab/files"
    target = "static/fonts"
  [[module.mounts]]
    source = "node_modules/@tabler/icons/icons"
    target = "assets/tabler-icons"
  [[module.mounts]]
    # Add hugo_stats.json to Hugo's server watcher
    source = "hugo_stats.json"
    target = "assets/watching/hugo_stats.json"
  [[module.mounts]]
    source = "node_modules/katex"
    target = "assets/katex"
  [[module.mounts]]
    source = "node_modules/prismjs"
    target = "assets/prismjs"
  [[module.mounts]]
    source = "node_modules/prism-themes/themes"
    target = "assets/prism-themes"
  [[module.mounts]]
    source = "prismjs"
    target = "assets/prismjs"

[params]
  math = true
  # dark or light, defaults to light. Local storage and OS preference override this param. For more details see: 
  # https://github.com/schnerring/hugo-theme-gruvbox/issues/34#issuecomment-1235870375
  defaultTheme = "dark"
  # gray red green yellow blue purple aqua orange, defaults to blue
  themeColor = "orange"
  # soft medium hard, defaults to medium
  themeContrast = "hard"
  author = "Stephen Jayakar"
  subtitle = ""
  description = "Software engineering, AI agents, game decompilation, distributed systems, and other things Stephen Jayakar finds interesting."

  [params.meta]
    favicon = true

  [params.imageResize]
    min = 400
    max = 1400
    increment = 500

  [params.logo]
    text = "stephenjayakar.com"
    url = "/"

  [params.prism]
    languages = [
      "markup",
      "css",
      "clike",
      "javascript",
      "bash",
      "diff",
      "toml",
      "python",
      "c",
      "powerpc-asm"
    ]
    plugins = [
      "normalize-whitespace",
      "toolbar",
      "copy-to-clipboard",
      "line-numbers",
      "command-line",
      "diff-highlight"
    ]


  [params.tagCloud]
    enable = true
    minFontSizeRem = 0.8
    maxFontSizeRem = 2.0
